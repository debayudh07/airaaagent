# Alternative to deployment/keepalive-worker: keeps the free Render backend from sleeping.
# GitHub may delay scheduled runs, and private repos spend Actions minutes (~4,300 min/month here).
name: keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.BACKEND_HEALTH_URL || 'https://airaaagent.onrender.com/api/health' }}
        run: |
          attempts=6
          delay=10

          for i in $(seq 1 "$attempts"); do
            if curl --fail --silent --show-error --max-time 90 "$URL"; then
              exit 0
            fi

            if [ "$i" -lt "$attempts" ]; then
              echo "Health check failed (attempt $i/$attempts), retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Health check failed after ${attempts} attempts."
          exit 1
