services:
  - type: web
    name: airaa-backend
    env: python
    rootDir: ai-agent
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DUNE_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: COINMARKETCAP_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Persistence + wallet features (all optional; see ai-agent/.env.example)
      - key: DATABASE_URL
        sync: false
      - key: AIRAA_JWT_SECRET
        sync: false
      - key: AIRAA_SIWE_DOMAINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AIRAA_CRON_SECRET
        sync: false
